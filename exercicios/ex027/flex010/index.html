<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row nowrap;
            background-color: lightsalmon;
        }
        div.item {
            flex-basis: 250px;
            flex-shrink: 1;
            flex-grow: 1;
            text-align: center;
            background-color: aqua;
            border: 1px solid black;
        }

        div#cxA {
            flex-shrink: 1;
            flex-grow: 0;
                    }

         div#cxB {
            flex-shrink: 0;
            flex-grow: 1; 
            }

         div#cxC {
            flex-shrink: 2;
            flex-grow: 0;  
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
       
    </div>
</body>
</html>
